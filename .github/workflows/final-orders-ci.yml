name: Final Orders CI

on:
  push:
    branches:
      - main
      - proyecto-final
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final-orders

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.4.3

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install

      - name: Run lint
        run: poetry run ruff check src tests

      - name: Run type-check
        run: poetry run mypy src/orders_api

      - name: Run tests
        run: poetry run pytest --cov=src --cov-report=term-missing

      - name: Run dependency audit
        run: poetry run pip-audit

      - name: Build package
        run: poetry build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: final-orders
        run: docker build -t final-orders:ci .