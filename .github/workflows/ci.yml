name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: Configure Poetry
        working-directory: avanzado/m04-empaquetado-cicd
        run: |
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        working-directory: avanzado/m04-empaquetado-cicd
        run: poetry install

      - name: Run lint
        working-directory: avanzado/m04-empaquetado-cicd
        run: poetry run ruff check .

      - name: Run type-check
        working-directory: avanzado/m04-empaquetado-cicd
        run: poetry run mypy src

      - name: Run tests
        working-directory: avanzado/m04-empaquetado-cicd
        run: poetry run pytest

      - name: Build package
        working-directory: avanzado/m04-empaquetado-cicd
        run: poetry build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orders-api-distributions
          path: avanzado/m04-empaquetado-cicd/dist/
          if-no-files-found: error

  docker:
    name: Docker build and publish
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/orders-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: avanzado/m04-empaquetado-cicd
          file: avanzado/m04-empaquetado-cicd/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}