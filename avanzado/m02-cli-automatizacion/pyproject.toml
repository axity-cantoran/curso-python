[project]
name = "m02-cli-automatizacion"
version = "0.1.0"
description = ""
authors = [
    {name = "axity-cantoran",email = "oscar.cantoran@axity.com"}
]
requires-python = ">=3.12"
dependencies = [
    "typer (>=0.27.2,<0.28.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[project.scripts]
orders = "m02_cli_automatizacion.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
